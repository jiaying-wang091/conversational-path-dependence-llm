[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase1c-conversational-path-dependence"
version = "0.3.0"
description = "Reproducible Phase 1C longitudinal self-reinforcement pilot"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
phase1-path-dependence = "path_dependence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
